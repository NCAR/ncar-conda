[pytest]
testpaths = smoke functional jupyterstack mpi
# only test_*.py are test modules (mpi/mpi_io_test.py is a helper launched by mpiexec)
python_files = test_*.py
# importlib mode: test directories are never put on sys.path, so names like
# "mpi" or "jupyterstack" cannot shadow real packages in the env under test
addopts = -ra --strict-markers --import-mode=importlib -p no:cacheprovider
# xunit1 keeps per-test <properties> (bandwidth, transports) in the JUnit XML
junit_family = xunit1
junit_logging = no
markers =
    smoke: import/command checks for every top-level package (seconds)
    functional: small end-to-end behavior checks of real workflows (minutes)
    jupyter: kernel and server checks, as JupyterHub users get them
    mpi: needs mpiexec inside a PBS allocation
    gpu: only runs on nodes with an NVIDIA GPU
    network: needs outbound internet (skipped automatically where there is none)
    pbs: submits PBS jobs (opt in with --run-pbs and --account)
    timeout(seconds): per-test time limit (default 300)
